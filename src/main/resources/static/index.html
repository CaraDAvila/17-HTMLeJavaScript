<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Calculadora Fiap & Co</title>
</head>
<body>

<h1>CALCULADORA </h1>
<label>Numero 1</label>
<input type="number" id="num1">

<label>Numero 2</label>
<input type="number" id="num2">

<select id="operacao">
    <option value="soma">Somar</option>
    <option value="subtracao">Subtrair</option>
    <option value="multiplicacao">Multiplicar</option>
    <option value="divisao">Dividir</option>
</select>

<button onclick="calcular()">Calcular</button>

<label>Resultado:<input type="text"id="resultado" readonly> </label>

<script>
    async function calcular() {
        const n1= document.getElementById("num1").value
        const n2= document.getElementById("num2").value

        const op= document.getElementById("operacao").value

        const url= `/calculadora/${op}?n1=${n1}&?n2=${n2}`
        const resposta= await fetch(url)
        const campo = document.getElementById("resultado")
        if (resposta.ok){
            campo.value = await resposta.text()
        }else {
            campo.value= "ERRO: opcao nao executada"
        }
    }
</script>

</body>
</html>
